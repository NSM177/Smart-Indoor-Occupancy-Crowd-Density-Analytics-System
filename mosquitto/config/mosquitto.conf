# Eclipse Mosquitto Configuration for Smart Indoor Occupancy System
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Standard MQTT Listener
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# WebSocket Listener
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true
